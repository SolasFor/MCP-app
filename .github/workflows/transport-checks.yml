name: MCP transport checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  transport:
    name: Verify & Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Linux Qt runtime libraries for headless UI tests
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxcb-cursor0 libdbus-1-3
      - name: Install pinned runtime and dev dependencies
        run: python -m pip install -r requirements.lock -r requirements-dev.txt
      - name: Compile modules
        run: python -m compileall -q backend app tests tools
      - name: Ruff lint check
        run: python -m ruff check app backend tests tools
      - name: Mypy static type check
        run: python -m mypy
      - name: License policy check
        run: python tools/check_licenses.py
      - name: SBOM generation smoke check
        run: python tools/generate_sbom.py --output build/SBOM.cdx.json
      - name: Dependency vulnerability audit
        run: python -m pip_audit -r requirements.lock --no-deps --disable-pip
      - name: Unit tests
        run: python -m unittest discover -s tests/unit -p "test_*.py" -v
      - name: Integration tests
        run: python -m unittest discover -s tests/integration -p "test_*.py" -v
      - name: Verify ASGI app initialization
        env:
          MCP_SECRET_TOKEN: ci-not-a-real-secret
          MCP_PUBLIC_URL: https://ci.example.com/mcp
          MCP_ALLOW_QUERY_TOKEN: "0"
          MCP_JSON_RESPONSE: "1"
        run: python -c "from backend.server import build_app; assert build_app() is not None; print('MCP ASGI app created')"
