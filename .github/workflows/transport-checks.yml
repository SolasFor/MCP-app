name: MCP transport checks

on:
  pull_request:
    paths:
      - "backend/**"
      - "app/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/transport-checks.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "app/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/transport-checks.yml"

permissions:
  contents: read

jobs:
  transport:
    name: Transport tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile server modules
        run: python -m compileall -q backend app tests
      - name: Test transport and security policies
        run: python -m unittest discover -s tests/unit -p "test_*.py" -v
      - name: Test actual MCP tool registration
        run: python -m unittest discover -s tests/integration -p "test_*.py" -v
      - name: Verify ASGI app initialization
        env:
          MCP_SECRET_TOKEN: ci-not-a-real-secret
          MCP_PUBLIC_URL: https://ci.example.com/mcp
          MCP_ALLOW_QUERY_TOKEN: "0"
          MCP_JSON_RESPONSE: "1"
        run: python -c "from backend.server import build_app; assert build_app() is not None; print('MCP ASGI app created')"
