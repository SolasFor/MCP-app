# Сборка MCP app на чистой Windows (GitHub Actions).
#
# Чтобы включить, перенесите файл (токену интеграции GitHub не хватило права `workflow`):
#     git mv packaging/ci/build.yml .github/workflows/build.yml
#     git commit -m "ci: enable build workflow" && git push
#
# * вручную: Actions -> Build -> Run workflow
# * на тег v*: собранные файлы прикрепляются к GitHub Release
name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build
        shell: pwsh
        run: ./packaging/build.ps1 -Python python

      - uses: actions/upload-artifact@v4
        with:
          name: MCPApp
          path: |
            dist/*.exe
            dist/*.zip
            build/selftest.txt

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.zip
