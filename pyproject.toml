[project]
name = "mcp-app"
version = "0.9.9"
description = "Windows desktop MCP server, gateway, and tunnel manager"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [".venv", ".venv-build", "build", "dist", "bin"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = [
    "E501",  # phased rollout: keep existing long docstrings/Russian UI lines readable
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
disallow_untyped_defs = false
files = [
    "app/platform",
    "app/core/secret_store.py",
    "app/core/redaction.py",
    "app/core/reconnect.py",
    "app/core/tunnels",
    "app/ui/tokens.py",
    "app/ui/i18n.py",
    "backend/gateway",
    "backend/tasks",
    "backend/servers",
    "backend/workspaces",
    "backend/desktop",
    "backend/extensions",
    "backend/remote",
    "backend/automation",
    "backend/managed_servers.py",
    "backend/process_runner.py",
    "backend/output_stream.py",
    "backend/tool_registry.py",
]
